name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the built wheel (clean, no source dir on path)
        run: python -m pip install dist/*.whl

      - name: Verify the package imports correctly
        working-directory: /tmp
        run: python -c "import eregion; import eregion.core, eregion.datamodels, eregion.pipeline, eregion.tasks, eregion.utils, eregion.configs; print('eregion imported OK from', eregion.__file__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/*
